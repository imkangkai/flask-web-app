name: Flask CI/CD
on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TOUGE_SERVER_HOST }} 
          port: "49572"
          username: root
          password: ${{ secrets.TOUGE_SSH_PASSWORD }}
          script: |
            cd /root/flask-web-app
            git pull
            supervisorctl restart flask-web-app
