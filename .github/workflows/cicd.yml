name: Flask CI/CD
on:
  push:
    branches: [ main ]
  workflow_dispatch: 
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unittest
        run: python -m unittest tests/test_app.py
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TOUGE_SERVER_HOST }} 
          port: "49572"
          username: root
          key: ${{ secrets.TOUGE_SSH_PRIVATE_KEY }}
          script: |
            cd /root/flask-web-app
            git pull
            supervisorctl restart flask-web-app
